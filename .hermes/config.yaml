# Slatecamp Hermes baseline configuration.
# Merge with an existing ~/.hermes/config.yaml instead of blindly overwriting.
# Keep secrets in ~/.hermes/.env, not here.
# Slatecamp developer AI is Codex-first; use GPT-5.5 where available.
# OpenRouter belongs to app/runtime AI for learners/users, not the default developer-agent path.

model:
  default: gpt-5.5
  provider: openai-codex
  api_mode: responses
  max_tokens: 4096
providers: {}
fallback_providers:
  - provider: opencode-go
    model: kimi-k2.6
    base_url: https://opencode.ai/zen/go/v1
    api_mode: chat_completions
toolsets:
  - hermes-cli

agent:
  max_turns: 90
  gateway_timeout: 1800
  restart_drain_timeout: 180
  api_max_retries: 3
  tool_use_enforcement: auto
  reasoning_effort: low
  image_input_mode: auto
  disabled_toolsets: []

terminal:
  backend: local
  cwd: "."
  timeout: 180
  env_passthrough: []
  shell_init_files: []
  auto_source_bashrc: true
  docker_image: "nikolaik/python-nodejs:python3.11-nodejs20"
  docker_forward_env: []
  docker_volumes: []
  docker_mount_cwd_to_workspace: false
  docker_run_as_host_user: false
  container_cpu: 1
  container_memory: 5120
  container_disk: 51200
  container_persistent: true

approvals:
  mode: manual
  timeout: 60

checkpoints:
  enabled: true
  max_snapshots: 50
  auto_prune: false
  retention_days: 7
  delete_orphans: true
  min_interval_hours: 24

compression:
  enabled: true
  threshold: 0.50
  target_ratio: 0.20
  protect_last_n: 20
  hygiene_hard_message_limit: 400

prompt_caching:
  cache_ttl: 5m

tool_output:
  max_bytes: 50000
  max_lines: 2000
  max_line_length: 2000

tool_loop_guardrails:
  warnings_enabled: true
  hard_stop_enabled: false
  warn_after:
    exact_failure: 2
    same_tool_failure: 3
    idempotent_no_progress: 2
  hard_stop_after:
    exact_failure: 5
    same_tool_failure: 8
    idempotent_no_progress: 5

browser:
  inactivity_timeout: 120
  command_timeout: 30
  record_sessions: false
  allow_private_urls: false
  auto_local_for_private_urls: true

skills:
  external_dirs: []

display:
  compact: false
  resume_display: full
  busy_input_mode: interrupt
  bell_on_complete: false
  show_reasoning: false
  final_response_markdown: strip
  inline_diffs: true
  show_cost: false
  skin: default

auxiliary:
  vision:
    provider: auto
    model: ""
    timeout: 120
  web_extract:
    provider: auto
    model: ""
    timeout: 360
  compression:
    provider: auto
    model: ""
    timeout: 120
  session_search:
    provider: auto
    model: ""
    timeout: 30
    max_concurrency: 3
  skills_hub:
    provider: auto
    model: ""
    timeout: 30
  approval:
    provider: auto
    model: ""
    timeout: 30
  title_generation:
    provider: auto
    model: ""
    timeout: 30
  curator:
    provider: auto
    model: ""
    timeout: 600

delegation:
  model: gpt-5.5
  provider: openai-codex
  base_url: ""
  api_key: ""
