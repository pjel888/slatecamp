name: Storybook

on:
  pull_request:
  push:
    branches:
      - main
      - master

concurrency:
  group: storybook-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  app-validation:
    name: App Release Validation
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      NEXT_PUBLIC_APP_URL: http://localhost:3217
      NEXT_PUBLIC_ENABLE_DEMO_MODE: "false"
      NEXT_PUBLIC_PAYMENTS_ENABLED: "false"
      NEXT_PUBLIC_SUPABASE_ANON_KEY: ci-anon-key
      NEXT_PUBLIC_SUPABASE_URL: https://hrpdwqurngnyajuhbkdg.supabase.co
      PLAYWRIGHT_BASE_URL: http://localhost:3217
      PLAYWRIGHT_PORT: "3217"
      DISABLE_DEV_FORCE_USER_ID: "true"
      PLAYWRIGHT_DEMO_AUTH: "false"
      PLAYWRIGHT_USE_BUILT_APP: "false"

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.11

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Install Playwright browser
        run: bunx playwright install --with-deps chromium

      - name: Run release validation
        run: bun run validate:release

  build:
    name: Build Storybook
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.11

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Validate Storybook governance
        run: bun run check:storybook

      - name: Build Storybook
        run: bun run build-storybook
