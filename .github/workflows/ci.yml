name: CI

on:
  pull_request:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  quality:
    name: Typecheck, lint, build, and smoke
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      NEXT_PUBLIC_APP_URL: http://localhost:3230
      NEXT_PUBLIC_ENABLE_DEMO_MODE: "true"
      NEXT_PUBLIC_PAYMENTS_ENABLED: "false"
      NEXT_PUBLIC_SUPABASE_ANON_KEY: ci-anon-key
      NEXT_PUBLIC_SUPABASE_URL: https://hrpdwqurngnyajuhbkdg.supabase.co
      PLAYWRIGHT_BASE_URL: http://localhost:3230
      PLAYWRIGHT_PORT: "3230"
      PLAYWRIGHT_DEMO_AUTH: "true"
      PLAYWRIGHT_USE_BUILT_APP: "false"
      DISABLE_DEV_FORCE_USER_ID: "true"

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.11

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Check entitlement boundary
        run: bun run check:entitlements

      - name: Typecheck
        run: bun run type-check

      - name: Lint
        run: bun run lint

      - name: Build
        run: bun run build

      - name: Install Playwright browser
        run: bunx playwright install --with-deps chromium

      - name: Focused beta smoke
        run: bunx playwright test e2e/v4-focused-smoke.spec.ts --project=chromium --workers=1

      - name: Upload Playwright artifacts on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: ci-playwright-artifacts
          path: |
            test-results
            playwright-report
          if-no-files-found: ignore
