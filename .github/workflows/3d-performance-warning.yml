name: 3D Performance Warning Gates

on:
  pull_request:
    paths:
      - 'src/app/dashboard/3d-lab/**'
      - 'src/features/3d-lab/**'
      - '.ai/00_performance/**'
      - 'scripts/playwright-web-server.ts'
      - 'package.json'
      - 'bun.lock'
  push:
    branches:
      - main
      - master
    paths:
      - 'src/app/dashboard/3d-lab/**'
      - 'src/features/3d-lab/**'
      - '.ai/00_performance/**'
      - 'scripts/playwright-web-server.ts'
      - 'package.json'
      - 'bun.lock'
  workflow_dispatch:

concurrency:
  group: 3d-performance-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  warning-gates:
    name: Built-auth 3D warning gates
    runs-on: ubuntu-latest
    timeout-minutes: 45
    continue-on-error: true
    env:
      NEXT_PUBLIC_APP_URL: http://localhost:3217
      NEXT_PUBLIC_ENABLE_DEMO_MODE: "true"
      NEXT_PUBLIC_PAYMENTS_ENABLED: "false"
      NEXT_PUBLIC_SUPABASE_ANON_KEY: ci-anon-key
      NEXT_PUBLIC_SUPABASE_URL: https://hrpdwqurngnyajuhbkdg.supabase.co
      PLAYWRIGHT_BASE_URL: http://localhost:3217
      PLAYWRIGHT_PORT: "3217"
      PLAYWRIGHT_DEMO_AUTH: "true"
      PLAYWRIGHT_USE_BUILT_APP: "true"
      DISABLE_DEV_FORCE_USER_ID: "true"
      PERF_3D_GATE_MODE: warning

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.11

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Install Playwright browser
        run: bunx playwright install --with-deps chromium

      - name: Run three comparable built-auth 3D passes
        run: bun run perf:3d:built-auth-repeat

      - name: Check 3D onboarding overlay coordination
        continue-on-error: true
        run: bun run perf:3d:onboarding

      - name: Run mobile-emulated 3D WebGL pass
        continue-on-error: true
        env:
          THREED_MOBILE_MODULE_LIMIT: "3"
        run: bun run perf:3d:mobile

      - name: Run full 3D module smoke matrix
        continue-on-error: true
        run: bun run perf:3d:smoke

      - name: Run 3D fallback checks
        continue-on-error: true
        run: bun run perf:3d:fallbacks

      - name: Evaluate warning gates
        run: bun run perf:3d:gates

      - name: Upload 3D performance artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: 3d-performance-warning-artifacts
          path: |
            .ai/00_performance/results/3d_lab_*.json
            .ai/00_performance/results/dev_server_memory_profile_loop5-built-auth-3d-pass-*.json
            .ai/00_performance/logs/3d-lab-built-auth-repeat.log
            .ai/00_performance/playwright/3d-test-output
            .ai/00_performance/playwright/3d-html-report
          if-no-files-found: warn
